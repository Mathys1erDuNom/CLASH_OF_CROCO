<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2a1d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Clash of Croco</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; background: #1c2614; color: #eef3e0; font: 14px system-ui, sans-serif; }
    #game { flex: 1; min-width: 0; position: relative; overflow: hidden; }
    #game canvas { display: block; }
    .float { position: absolute; transform: translate(-50%, -50%); pointer-events: none; font-weight: 800; font-size: 16px; text-shadow: 0 2px 0 #000, 0 0 4px #000; white-space: nowrap; }
    #panel { width: 300px; overflow-y: auto; padding: 12px; background: linear-gradient(#3a2a1a, #2a1d12); border-left: 6px solid #6d4a26; box-shadow: inset 4px 0 0 #8b6a3a; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    h2 { font-size: 15px; margin: 16px 0 6px; color: #ffd84a; text-transform: uppercase; letter-spacing: .05em; }
    .res { display: flex; gap: 16px; font-size: 18px; font-weight: bold; margin-bottom: 8px; }
    button { display: block; width: 100%; margin: 4px 0; padding: 6px 8px; text-align: left; font: inherit; color: #1c2614;
      background: linear-gradient(#e9f2c4, #c7da8e); border: 3px solid #2b1d14; border-radius: 10px; box-shadow: 0 3px 0 #2b1d14; font-weight: 600; cursor: pointer; }
    button:hover:not(:disabled) { background: #eaf6c4; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.sel { background: #ffd84a; border-color: #a08000; }
    button { display: grid; grid-template-columns: 40px 1fr; align-items: center; column-gap: 8px; }
    button img { grid-row: span 2; width: 40px; height: 40px; object-fit: contain; }
    button:not(:has(img)) { display: block; }
    button small { display: block; color: #4a5a30; }
    .res img, img.i { width: 26px; height: 26px; vertical-align: middle; }
    .sel-box { background: #1f160d; border: 2px solid #ffe066; border-radius: 10px; padding: 8px 10px; margin: 8px 0; }
    .sel-box h2 { margin-top: 0; }
    .lvl { color: #ffe066; letter-spacing: 2px; }
    .army { display: flex; gap: 14px; font-weight: bold; font-size: 16px; }
    .troop img { width: 30px; height: 30px; vertical-align: middle; }
    .train-row { display: flex; gap: 6px; align-items: stretch; }
    .train-row > button:first-child { flex: 1; }
    button.info { width: 34px; flex: none; display: flex; align-items: center; justify-content: center; padding: 0; font: italic 700 18px Georgia, serif; border-radius: 50%; align-self: center; height: 34px; }
    .stats { background: #f4ecd0; color: #2b1d14; border: 2px solid #2b1d14; border-radius: 8px; padding: 6px 8px; margin: 0 0 6px; font-size: 12px; line-height: 1.5; }
    span.up { display: block; color: #1f6a1f; font-weight: 600; }
    span.up b { color: #138a13; }
    span.up em { font-style: normal; background: #c9f0b0; border-radius: 6px; padding: 0 4px; margin-left: 2px; }
    span.same { display: block; color: #8a8a7a; }
    #screen { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px; background: radial-gradient(#3f5a2a, #1c2614); }
    #screen .card { max-width: 380px; width: 100%; text-align: center; background: linear-gradient(#3a2a1a, #2a1d12); border: 4px solid #6d4a26; border-radius: 16px; padding: 24px; }
    #screen h1 { font-size: 28px; }
    #screen button, a.discord { display: block; width: 100%; margin: 10px 0; text-align: center; }
    a.discord, button.discord { padding: 12px; border-radius: 10px; background: #5865f2; color: #fff; font-weight: 700; text-decoration: none; border: 3px solid #2b1d14; }
    #account { position: absolute; top: 10px; left: 10px; display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 4px; border-radius: 24px; background: rgba(28, 20, 12, .8); }
    #account img { width: 32px; height: 32px; border-radius: 50%; }
    #account button { display: inline-block; width: auto; margin: 0; padding: 4px 8px; font-size: 12px; }
    .menus { display: flex; gap: 8px; margin: 8px 0; }
    .menus button.menu-btn { display: block; flex: 1; text-align: center; font-size: 16px; padding: 10px 6px; margin: 0; }
    .menu-box { background: rgba(0,0,0,.25); border: 2px solid #6d4a26; border-radius: 10px; padding: 4px 8px 8px; margin-bottom: 8px; }
    .hint { color: #b8c890; font-style: italic; }
    .err { color: #ff9a8a; font-weight: bold; }
    .big { font-size: 32px; color: #ffd84a; margin: 4px 0; }
    /* ---- Mobile: full-screen map, resources on top, big buttons at the bottom, sheets that slide up */
    @media (max-width: 700px), (pointer: coarse) and (max-height: 520px) {
      html, body { height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      body { display: block; }
      #game { position: fixed; inset: 0; }
      #panel { position: fixed; left: 8px; right: 8px; bottom: calc(86px + env(safe-area-inset-bottom)); width: auto; max-height: 52dvh; padding: 10px;
        border: 0; box-shadow: none; background: transparent; overflow-y: auto; pointer-events: none; -webkit-overflow-scrolling: touch; }
      #panel > * { pointer-events: auto; }
      #panel:has(.sel-box, .menu-box, .deploy, .result) { background: linear-gradient(rgba(58, 42, 26, .97), rgba(42, 29, 18, .97)); border: 4px solid #6d4a26; border-radius: 18px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, .5); animation: sheet .18s ease-out; }
      @keyframes sheet { from { transform: translateY(24px); opacity: 0; } }
      #panel > h1:first-child, #panel .extra { display: none; }
      .res { position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 8px; margin: 0; gap: 6px; font-size: 15px; }
      .res span { background: rgba(28, 20, 12, .85); border: 2px solid #6d4a26; border-radius: 20px; padding: 3px 10px 3px 4px; display: flex; align-items: center; gap: 4px; }
      .res img { width: 22px; height: 22px; }
      .menus { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); margin: 0; gap: 8px; }
      .menus button.menu-btn { min-height: 66px; font-size: 15px; border-radius: 16px; box-shadow: 0 4px 0 #2b1d14; }
      .sel-box, .menu-box { margin: 0; border: 0; background: none; padding: 0; }
      button { min-height: 48px; }
      button.info { width: 44px; height: 44px; min-height: 44px; }
      #account { top: calc(8px + env(safe-area-inset-top)); left: 8px; padding: 3px; }
      #account span { display: none; }
      #account button { min-height: 0; }
      .float { font-size: 18px; }
      /* attack: troops in one horizontal row, swipe to see more */
      .deploy { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
      .deploy button { flex: 0 0 auto; width: 128px; margin: 0; grid-template-columns: 1fr; text-align: center; font-size: 12px; }
      .deploy button img { grid-row: auto; justify-self: center; }
      #panel:has(.deploy) { bottom: calc(8px + env(safe-area-inset-bottom)); }
      #panel:has(.deploy) .hint, #panel:has(.deploy) h2 { display: none; }
      #panel:has(.deploy) h1, #panel h1.result { display: block; font-size: 16px; margin: 0; }
      .status { margin: 4px 0 8px; font-weight: 700; }
      button.retreat { text-align: center; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <aside id="panel">Chargement…</aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
